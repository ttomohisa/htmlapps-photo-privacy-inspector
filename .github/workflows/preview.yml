# PR source code must never run on the credential-bearing runner.
name: Deploy PR preview
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24
    - name: Validate PowerShell syntax and encoding
      shell: pwsh
      run: |
        if (Test-Path -LiteralPath ".\scripts\check-powershell-syntax.ps1") {
          .\scripts\check-powershell-syntax.ps1
        } else {
          Write-Host "PowerShell syntax preflight is not present in this repository; continuing with the repository check."
        }
    - name: Build and verify standalone HTML
      shell: pwsh
      run: ./scripts/check-repository.ps1
    - name: Verify mobile label in Chromium
      shell: pwsh
      run: |
        $testTools = Join-Path $env:RUNNER_TEMP "mobile-label-tests"
        npm install --prefix $testTools --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
        if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed." }
        $env:NODE_PATH = Join-Path $testTools "node_modules"
        & (Join-Path $testTools "node_modules/.bin/playwright.cmd") install chromium
        if ($LASTEXITCODE -ne 0) { throw "Chromium installation failed." }
        New-Item -ItemType Directory -Force -Path test-results/mobile-label | Out-Null
        node scripts/mobile-label.browser.cjs 2>&1 | Tee-Object -FilePath test-results/mobile-label/results.log
        if ($LASTEXITCODE -ne 0) { throw "Mobile label browser regression failed." }
    - name: Exercise actual photo workflows in Chromium
      shell: pwsh
      run: |
        $env:NODE_PATH = Join-Path $env:RUNNER_TEMP "mobile-label-tests/node_modules"
        New-Item -ItemType Directory -Force -Path test-results/photo-browser | Out-Null
        node scripts/test-photo-browser.cjs 2>&1 | Tee-Object -FilePath test-results/photo-browser/results.log
        if ($LASTEXITCODE -ne 0) { throw "Real-browser photo workflow regression failed." }
    - name: Independently verify unchanged decoded pixels
      shell: pwsh
      run: |
        $env:PHOTO_CLEAN_OUTPUT_DIR = Join-Path (Get-Location) "test-results/pixel-outputs"
        New-Item -ItemType Directory -Force -Path $env:PHOTO_CLEAN_OUTPUT_DIR | Out-Null
        node --test scripts/test-photo-clean.cjs 2>&1 | Tee-Object -FilePath test-results/photo-browser/pixel-generation.log
        if ($LASTEXITCODE -ne 0) { throw "Fixture cleanup failed." }
        python -m pip install --disable-pip-version-check pillow==11.3.0
        if ($LASTEXITCODE -ne 0) { throw "Pillow installation failed." }
        python scripts/verify-photo-pixels.py $env:PHOTO_CLEAN_OUTPUT_DIR 2>&1 | Tee-Object -FilePath test-results/photo-browser/pixel-verification.log
        if ($LASTEXITCODE -ne 0) { throw "Independent decoded-pixel comparison failed." }
    - name: Upload mobile label browser evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mobile-label-browser-evidence
        path: |
          test-results/mobile-label/
          test-results/photo-browser/
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload static preview site
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-preview-site
        path: dist/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
        include-hidden-files: true
    permissions:
      contents: read
