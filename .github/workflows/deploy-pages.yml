name: Deploy standalone app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      pages-ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Check whether GitHub Pages is enabled
        id: pages-status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/pages" --silent 2>$null

          if ($LASTEXITCODE -eq 0) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "GitHub Pages is enabled. The deployment will continue."
            exit 0
          }

          "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          @"
          ## GitHub Pages is not enabled yet

          The standalone HTML was built successfully, but deployment was skipped.

          1. Open **Settings → Pages** in this repository.
          2. Under **Build and deployment**, set **Source** to **GitHub Actions**.
          3. Open **Actions**, select this workflow, and choose **Re-run all jobs**.

          This one-time repository setting cannot be enabled with the default `GITHUB_TOKEN`.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          Write-Warning "GitHub Pages is not enabled. Deployment is skipped; see the workflow summary for setup steps."
          exit 0

      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: needs.build.outputs.pages-ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Create tag and GitHub Release after successful deployment
    if: github.event_name == 'push' && needs.deploy.result == 'success'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check version and existing release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./app.config.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::app.config.json must have stable SemVer, got: $version"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; leaving its tag and assets unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::Existing tag $tag refers to $existing, not this deploy ($GITHUB_SHA). Bump the version."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download successful build outputs
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: standalone-html-${{ github.sha }}
          path: dist

      - name: Validate and package versioned downloads
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-files.cjs
          node scripts/prepare-release.cjs
          (cd dist/release-package && sha256sum -c SHA256SUMS.txt)

      - name: Create version tag and publish release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" >/dev/null
          elif [[ "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG changed before publication; refusing to overwrite it."
            exit 1
          fi
          name="htmlapps-photo-privacy-inspector-$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "dist/release-package/$name.html" \
            "dist/release-package/$name.self-extract.html" \
            "dist/release-package/$name.zip" \
            "dist/release-package/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title "Photo Privacy Inspector $RELEASE_TAG" --notes-file dist/release-package/notes.md
          echo "Published $RELEASE_TAG with 4 verified download assets." >> "$GITHUB_STEP_SUMMARY"
